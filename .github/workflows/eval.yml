name: RAG Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check versions
        run: |
          python -c "import langchain; print('langchain:', langchain.__version__)"
          python -c "from langchain.retrievers import EnsembleRetriever; print('langchain.retrievers ok')" || python -c "from langchain_community.retrievers import EnsembleRetriever; print('langchain_community.retrievers ok')"

      - name: Ingest test documents
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py ingest docs/

      - name: Test ask command
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py ask "what is this document about?"