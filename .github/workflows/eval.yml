name: RAG Evaluation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest test documents
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py ingest docs/

      - name: Test ask command
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python main.py ask "what is this document about?"
      - name: Debug langchain structure
        run: python -c "import langchain; import langchain_community; print('langchain version:', langchain.__version__); from langchain_community.retrievers import BM25Retriever; print('BM25 ok'); import subprocess; subprocess.run(['python', '-c', 'import pkgutil; import langchain; [print(m.name) for m in pkgutil.iter_modules(langchain.__path__)]'])"